<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研究工作台（React 前端）</title>
<!--
  React 前端演示页（免构建）：运行时已 vendor 到本地 vendor/ 目录（离线可用），
  本地缺失时回退 CDN。消费与标准库工作台同语义的 JSON API
  （POST /api/runs → GET /api/runs/{id}）。
  说明：运行时与 API 都不可用时页面显示明确的回退提示，
  请使用零依赖默认入口：python -m src.interfaces.web.workbench
  渲染全部走 textContent（不走 HTML 字符串注入），与工作台的安全红线一致。
-->
<script src="vendor/react.production.min.js"></script>
<script>window.React || document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>')</script>
<script src="vendor/react-dom.production.min.js"></script>
<script>window.ReactDOM || document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>')</script>
<script src="vendor/htm.umd.js"></script>
<script>window.htm || document.write('<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"><\/script>')</script>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 720px;
         margin: 2rem auto; padding: 0 1rem; color: #1c2430; }
  textarea { width: 100%; min-height: 96px; padding: .6rem; box-sizing: border-box; }
  button { padding: .5rem 1.2rem; margin-top: .5rem; cursor: pointer; }
  .card { border: 1px solid #d6dbe1; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  .status { font-weight: 600; }
  .status.completed { color: #12703a; }
  .status.failed, .status.cancelled { color: #a3261f; }
  pre { white-space: pre-wrap; background: #f6f8fa; padding: .8rem; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  if (!window.React || !window.ReactDOM || !window.htm) {
    document.getElementById("root").textContent =
      "React 运行时加载失败（本地 vendor 与 CDN 均不可用）。" +
      "请使用零依赖默认入口 python -m src.interfaces.web.workbench";
    return;
  }
  var html = window.htm.bind(window.React.createElement);
  var useState = window.React.useState, useEffect = window.React.useEffect,
      useRef = window.React.useRef;

  function App() {
    // useState 返回 [值, setter]，必须整体接收再解构（此前直接解构函数对象是错的）
    var goalState = useState(""), goal = goalState[0], setGoal = goalState[1];
    var jobState = useState(null), job = jobState[0], setJob = jobState[1];
    var busyState = useState(false), busy = busyState[0], setBusy = busyState[1];
    var errorState = useState(""), error = errorState[0], setError = errorState[1];
    var timer = useRef(null);

    function submit() {
      if (!goal[0].trim()) return;
      setBusy(true); setError(""); setJob(null);
      fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal: goal[0], flow: "agent", mode: "mock" })
      }).then(function (r) {
        if (!r.ok) throw new Error("提交失败 HTTP " + r.status);
        return r.json();
      }).then(function (data) { poll(data.job_id); })
        .catch(function (e) { setError(String(e.message || e)); setBusy(false); });
    }

    function poll(jobId) {
      fetch("/api/runs/" + jobId).then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status === "running") {
            timer.current = setTimeout(function () { poll(jobId); }, 1000);
          } else {
            setJob(data); setBusy(false);
          }
        }).catch(function (e) { setError(String(e.message || e)); setBusy(false); });
    }

    useEffect(function () {
      return function () { if (timer.current) clearTimeout(timer.current); };
    }, []);

    return html`
      <div>
        <h1>研究任务工作台</h1>
        <p>输入目标 → 提交 → 系统自动执行并回填结果（FastAPI 适配层 + React 前端）。</p>
        <textarea value=${goal[0]}
                  onInput=${function (e) { setGoal(e.target.value); }}
                  placeholder="例如：整理下面这段材料的研究主题并给出三个要点"></textarea>
        <button onClick=${submit} disabled=${busy[0]}>
          ${busy[0] ? "运行中…" : "提交任务"}
        </button>
        ${error[0] && html`<div class="card status failed">${error[0]}</div>`}
        ${job && html`
          <div class="card">
            <div>任务 <code>${job.job_id}</code> —
              <span class=${"status " + job.status}>${job.status}</span></div>
            ${job.result && html`<pre>${job.result}</pre>`}
            ${job.error && html`<pre>${job.error}</pre>`}
          </div>`}
      </div>`;
  }

  window.ReactDOM.createRoot(document.getElementById("root")).render(
    window.React.createElement(App));
})();
</script>
</body>
</html>
