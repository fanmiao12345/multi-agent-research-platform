[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mvp"
version = "0.1.0"
description = "从零基于 LangGraph 搭建 Agent Harness & Multi-Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
